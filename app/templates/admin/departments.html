{% extends 'base.html' %}{% block content %}<h1 class="h3">Departments</h1><div class="row"><div class="col-md-5"><form method="post" class="card card-body shadow-sm"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input required name="code" class="form-control mb-2" placeholder="Code, e.g. CSE"><input required name="name" class="form-control mb-2" placeholder="Department name"><button class="btn btn-primary">Add department</button></form></div><div class="col-md-7"><ul class="list-group">{% for department in departments %}<li class="list-group-item"><strong>{{ department.code }}</strong> — {{ department.name }}</li>{% endfor %}</ul></div></div>{% endblock %}
